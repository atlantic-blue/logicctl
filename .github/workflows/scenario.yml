name: scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: The name of the one test to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  scenario:
    name: run one scenario
    runs-on: macos-15
    env:
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Print the toolchain
        run: swift --version

      - name: Run the scenario and count what ran
        run: |
          set -uo pipefail
          status=0
          swift test --filter "$SCENARIO" 2>&1 | tee scenario-output.txt || status=$?
          swiftTesting=$(sed -n 's/.*Test run with \([0-9][0-9]*\) test.*/\1/p' scenario-output.txt | tail -1)
          xctest=$(sed -n 's/.*Executed \([0-9][0-9]*\) test.*/\1/p' scenario-output.txt | tail -1)
          count=$(( ${swiftTesting:-0} + ${xctest:-0} ))
          echo "scenarios: $count"
          if [ "$count" -eq 0 ]; then
            echo "the filter found no test of that name, so this run proves nothing"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "the scenario ran and it failed"
            exit "$status"
          fi
