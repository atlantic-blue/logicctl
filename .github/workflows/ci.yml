name: main

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, lint and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Print the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint the format
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Build in release mode
        run: swift build --configuration release

      - name: Run the tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt

      - name: Fail when no test ran
        run: |
          set -euo pipefail
          swiftTesting=$(sed -n 's/.*Test run with \([0-9][0-9]*\) test.*/\1/p' test-output.txt | tail -1)
          xctest=$(sed -n 's/.*Executed \([0-9][0-9]*\) test.*/\1/p' test-output.txt | tail -1)
          count=$(( ${swiftTesting:-0} + ${xctest:-0} ))
          echo "tests: $count"
          if [ "$count" -eq 0 ]; then
            echo "no test ran, so this run proves nothing"
            exit 1
          fi

      - name: Sign the binary ad hoc
        run: |
          set -euo pipefail
          binary="$(swift build --configuration release --show-bin-path)/logicctl"
          codesign --force --sign - "$binary"
          codesign --verify --verbose "$binary"
          "$binary" --help
